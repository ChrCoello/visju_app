<!DOCTYPE html>
<html>
<head>
    <title>Dialogue Layout Test</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="main-content">
            <h2>Dialogue Layout Test</h2>

            <div class="dialogue-container">
                <div class="dialogue-turn">
                    <div class="dialogue-left">Hei, hvordan går det?</div>
                    <div class="dialogue-right"></div>
                </div>

                <div class="dialogue-turn">
                    <div class="dialogue-left"></div>
                    <div class="dialogue-right">Ja, takk! Og med deg?</div>
                </div>

                <div class="dialogue-turn">
                    <div class="dialogue-left">Veldig bra!</div>
                    <div class="dialogue-right">Flott å høre!</div>
                </div>
            </div>

            <p style="margin-top: 2rem;">
                If you see:
                <ul>
                    <li>Blue boxes on the LEFT for Speaker 1</li>
                    <li>Green boxes on the RIGHT for Speaker 2</li>
                    <li>Two columns side-by-side</li>
                </ul>
                Then the CSS is loaded correctly!
            </p>
        </div>
    </div>
</body>
</html>
