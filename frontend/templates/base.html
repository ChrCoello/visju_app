<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vidarshov Gård Recording App{% endblock %}</title>
    {% if dev_mode %}
    <!-- Development mode: Disable caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="/static/css/style.css?t={{ range(1, 999999) | random }}">
    {% else %}
    <!-- Production mode: Enable caching -->
    <link rel="stylesheet" href="/static/css/style.css?v=2">
    {% endif %}
</head>
<body>
    <header>
        <div class="header-content">
            <h1>🇳🇴 Vidarshov Gård</h1>
            <nav>
                <a href="/">Home</a>
                <a href="/sessions">Sessions</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="main-content">
            {% block content %}{% endblock %}
        </div>
    </main>

    {% if dev_mode %}
    <!-- Development mode: Disable JS caching with timestamp -->
    <script src="/static/js/app.js?t={{ range(1, 999999) | random }}"></script>
    {% else %}
    <!-- Production mode: Enable JS caching with version -->
    <script src="/static/js/app.js?v=2"></script>
    {% endif %}
    {% block scripts %}{% endblock %}
</body>
</html>
